name: Build Android APK

# Builds the app on every push to main and publishes it as the "latest" release,
# so the APK can be downloaded straight to a phone from the repo's Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PrintProofer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PrintProofer.apk \
            --title "Print Proofer (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your Android phone: download PrintProofer.apk, open it, and allow installing from this source when asked."
      - uses: actions/upload-artifact@v4
        with:
          name: PrintProofer-apk
          path: PrintProofer.apk
